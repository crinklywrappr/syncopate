name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Single source of truth for the supported Datalevin range lives in deps.edn's
  # :ci alias (:datalevin/versions). This job reads it and emits the test matrices
  # as JSON so the jobs below build their matrix via fromJSON — nothing to keep in
  # sync here. `embedded` = every supported version; `remote` = [floor, newest].
  matrix:
    runs-on: ubuntu-latest
    outputs:
      embedded: ${{ steps.gen.outputs.embedded }}
      remote: ${{ steps.gen.outputs.remote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Generate datalevin matrix from deps.edn
        id: gen
        run: |
          {
            echo "embedded=$(clojure -T:build matrix :which :embedded | tail -n1)"
            echo "remote=$(clojure -T:build matrix :which :remote | tail -n1)"
          } >> "$GITHUB_OUTPUT"

  # Prove the supported Datalevin range (floor .. newest). deps.edn pins the floor;
  # `:dl <version>` overrides it for one embedded run (injected as an :extra dep).
  test-matrix:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datalevin: ${{ fromJSON(needs.matrix.outputs.embedded) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Test (embedded, datalevin ${{ matrix.datalevin }})
        run: clojure -T:build test :dl '"${{ matrix.datalevin }}"'

  # Client/server (dtlv://) suite against a REAL, separate datalevin server, with
  # server AND client on the SAME version (matched, never skewed — we test our
  # code across versions, not datalevin's wire compat). Each cell is slower than
  # embedded (every assertion is a network round-trip), so we run only the FLOOR
  # and the NEWEST supported version, not every one in between.
  remote:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datalevin: ${{ fromJSON(needs.matrix.outputs.remote) }}   # floor + newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Test (client/server, datalevin ${{ matrix.datalevin }})
        # Server gets the version via -Sdeps (overrides the floor pin); client gets
        # it via :dl (an :extra dep). Both must match.
        run: |
          clojure -Sdeps "{:deps {datalevin/datalevin {:mvn/version \"${{ matrix.datalevin }}\"}}}" -M:server & echo $! > /tmp/dtlv.pid
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/8898) 2>/dev/null && break; sleep 1; done
          clojure -T:build test :remote true :dl '"${{ matrix.datalevin }}"'
          kill "$(cat /tmp/dtlv.pid)" || true

  ci:
    runs-on: ubuntu-latest
    needs: [test-matrix, remote]   # deploy only after the whole support matrix is green
    permissions:
      contents: write            # push the release tag on master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # version is 1.0.<git rev count> — needs full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-

      - name: Build
        # Just package the JAR. The `test-matrix` (embedded, incl. the floor) and
        # `remote` jobs cover the suite and gate this job via `needs`, so there's
        # no need to re-run tests before building/deploying.
        run: clojure -T:build jar

      - name: Deploy to Clojars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          TAG="v1.0.$(git rev-list --count HEAD)"   # matches build.clj's version
          git tag "$TAG"
          git push origin "$TAG"
