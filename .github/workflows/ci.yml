name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Prove the supported Datalevin range (floor .. newest). deps.edn pins the
  # floor; each :dl-<version> alias overrides it for one embedded run.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datalevin: ['1.0.1', '1.0.2', '1.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Test (embedded, datalevin ${{ matrix.datalevin }})
        run: clojure -T:build test :dl '"${{ matrix.datalevin }}"'

  # Client/server (dtlv://) suite against a REAL, separate datalevin server, with
  # server AND client on the SAME version (matched, never skewed — we test our
  # code across versions, not datalevin's wire compat). Each cell is slower than
  # embedded (every assertion is a network round-trip), so we run only the FLOOR
  # and the NEWEST supported version, not every one in between.
  remote:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datalevin: ['1.0.1', '1.1.0']   # floor + newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Test (client/server, datalevin ${{ matrix.datalevin }})
        # Server gets the version via the :dl-<v> alias composed onto :server;
        # client gets it via :dl. Both must match.
        run: |
          clojure -M:server:dl-${{ matrix.datalevin }} & echo $! > /tmp/dtlv.pid
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/8898) 2>/dev/null && break; sleep 1; done
          clojure -T:build test :remote true :dl '"${{ matrix.datalevin }}"'
          kill "$(cat /tmp/dtlv.pid)" || true

  ci:
    runs-on: ubuntu-latest
    needs: [test-matrix, remote]   # deploy only after the whole support matrix is green
    permissions:
      contents: write            # push the release tag on master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # version is 1.0.<git rev count> — needs full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-

      - name: Test + build
        # Embedded suite (at the pinned floor) + jar build. Cross-version embedded
        # coverage is the `test-matrix` job; client/server is the `remote` job —
        # both gate this via `needs`, so this is the final build/deploy step.
        run: clojure -T:build ci

      - name: Deploy to Clojars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          TAG="v1.0.$(git rev-list --count HEAD)"   # matches build.clj's version
          git tag "$TAG"
          git push origin "$TAG"
