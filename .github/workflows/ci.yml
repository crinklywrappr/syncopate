name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Prove the supported Datalevin range (floor .. newest). deps.edn pins the
  # floor; each :dl-<version> alias overrides it for one embedded run.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        datalevin: ['1.0.1', '1.0.2', '1.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-
      - name: Test (embedded, datalevin ${{ matrix.datalevin }})
        run: clojure -T:build test :dl '"${{ matrix.datalevin }}"'

  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # push the release tag on master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # version is 1.0.<git rev count> — needs full history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-

      - name: Test (client/server)
        # Run the suite as a pure client against a REAL, separate datalevin
        # server process (not in-process) — the client/server boundary is the
        # thing under test. Swap for a datalevin service container via
        # `:server-uri` if stronger isolation is ever wanted.
        run: |
          clojure -M:server & echo $! > /tmp/dtlv.pid
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/8898) 2>/dev/null && break; sleep 1; done
          clojure -T:build test :remote true
          kill "$(cat /tmp/dtlv.pid)" || true

      - name: Test + build
        # Existing embedded suite + jar build (runs once).
        run: clojure -T:build ci

      - name: Deploy to Clojars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy

      - name: Tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          TAG="v1.0.$(git rev-list --count HEAD)"   # matches build.clj's version
          git tag "$TAG"
          git push origin "$TAG"
